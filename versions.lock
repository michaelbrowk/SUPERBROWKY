# Claude Code Design Kit — pinned versions (single source of truth).
#
# install-skills.sh and bootstrap.sh read their pins from here. Bumping a
# version means editing ONE line, not hunting through the scripts.
#
# Check for upstream drift (read-only, edits nothing):
#   bash install-skills.sh --check-updates
# Ride the latest instead of these pins (may break — see README):
#   bash install-skills.sh --latest   /   bash bootstrap.sh <proj> --latest
#
# Format: <key>=<value>, one per line. Keys are repo slugs (owner/name) for
# skill sources, plus impeccable-cli for the per-project engine's npm version.

