name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate manifest and skill packages
        run: |
          python3 scripts/validate-manifest.py
          python3 scripts/validate-skills.py
          python3 tests/validate-skills-fixture.py

      - name: Parse and lint Bash
        run: |
          bash -n bootstrap.sh install-skills.sh scripts/*.sh tests/lifecycle.sh
          shellcheck -S warning \
            bootstrap.sh install-skills.sh scripts/*.sh tests/lifecycle.sh

      - name: Parse bundled JavaScript
        run: |
          find skills -type f -name '*.mjs' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
          node --check tests/meta-scan-fixture.mjs
          node --check tests/compress-images-fixture.mjs

      - name: Helper behavior
        run: |
          node skills/a11y-audit/scripts/contrast-check.mjs "#111827:#ffffff"
          if node skills/a11y-audit/scripts/contrast-check.mjs "#ffffff:#ffffff"; then
            echo "expected a failing contrast pair to return non-zero"
            exit 1
          fi
          if node skills/a11y-audit/scripts/contrast-check.mjs "rgb(999,999,999):#ffffff"; then
            echo "expected out-of-range rgb() to be rejected"
            exit 1
          fi
          if node skills/a11y-audit/scripts/contrast-check.mjs "rgb(0 0 0 / .5):#ffffff"; then
            echo "expected alpha rgb() to be rejected"
            exit 1
          fi
          if node skills/a11y-audit/scripts/contrast-check.mjs; then
            echo "expected empty input to be rejected"
            exit 1
          fi
          if node skills/a11y-audit/scripts/contrast-check.mjs --threshold -1 "#fff:#fff"; then
            echo "expected an invalid threshold to be rejected"
            exit 1
          fi
          if node skills/a11y-audit/scripts/contrast-check.mjs "#000:#fff:#f00"; then
            echo "expected a malformed pair to be rejected"
            exit 1
          fi
          node skills/psi-optimize/scripts/compress-images.mjs --help
          node skills/meta-audit/scripts/meta-scan.mjs --help
          node tests/meta-scan-fixture.mjs
          node tests/compress-images-fixture.mjs

      - name: No whitespace errors
        run: git diff-tree --check --no-commit-id --root -r HEAD

  node22-helpers:
    name: Helper compatibility — Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Parse and exercise helpers
        run: |
          find skills -type f -name '*.mjs' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
          node skills/a11y-audit/scripts/contrast-check.mjs "#111827:#ffffff"
          node tests/meta-scan-fixture.mjs
          node tests/compress-images-fixture.mjs

  bash-linux:
    name: Bash lifecycle — Linux
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 22 baseline
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Isolated plan/apply/drift/uninstall lifecycle
        run: SUPERBROWKY_TEST_PROFILE=full bash tests/lifecycle.sh

  bash-macos:
    name: Bash lifecycle — macOS 3.2
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Confirm system Bash
        run: /bin/bash --version

      - name: Isolated plan/apply/drift/uninstall lifecycle
        run: /bin/bash tests/lifecycle.sh

  powershell-windows:
    name: PowerShell lifecycle — Windows
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $files = @(
            "bootstrap.ps1",
            "install-skills.ps1",
            "scripts/doctor.ps1",
            "scripts/audit-bundle.ps1",
            "tests/lifecycle.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "ok: $file"
          }

      - name: Git Bash line endings and plan
        shell: bash
        run: |
          bash -n bootstrap.sh install-skills.sh scripts/*.sh tests/lifecycle.sh
          root="$(mktemp -d)"
          project="$root/project"
          mkdir -p "$project" "$root/home/.claude" "$root/home/.codex"
          export HOME="$root/home"
          export CLAUDE_HOME="$HOME/.claude"
          export CODEX_HOME="$HOME/.codex"
          export SUPERBROWKY_STATE_HOME="$HOME/.superbrowky"
          bash bootstrap.sh "$project" --harness both --profile core > "$root/plan.txt"
          test -z "$(find "$project" -mindepth 1 -print -quit)"
          test ! -e "$SUPERBROWKY_STATE_HOME"
          grep -q "PLAN ONLY" "$root/plan.txt"

      - name: Isolated plan/apply/drift/uninstall lifecycle
        shell: pwsh
        run: |
          $env:SUPERBROWKY_TEST_PROFILE = "full"
          ./tests/lifecycle.ps1
